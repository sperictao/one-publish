[workspace]
members = [
  "crates/publish-domain",
  "crates/publish-adapters",
  "crates/publish-planner",
  "crates/publish-runner-core",
]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.77.0"

[workspace.dependencies]
hex = "0.4"
json5 = "0.4"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "2.0"
toml_edit = "0.23"

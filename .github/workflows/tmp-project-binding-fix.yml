name: Temporary Project Binding Ownership Fix

on:
  push:
    branches: [tmp/fix-project-binding-ownership]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tmp/fix-project-binding-ownership
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/scripts/fix_project_binding_ownership.py
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Focused source tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml draft_source_marks_project_binding_provider_mismatch_blocked
          cargo test --manifest-path src-tauri/Cargo.toml project_profile_source_resolves_pubxml_reference
          cargo test --manifest-path src-tauri/Cargo.toml resolved_spec_rejects_project_binding_owned_by_another_provider
      - name: Commit clean target tree
        run: |
          rm .github/scripts/fix_project_binding_ownership.py
          rm .github/workflows/tmp-project-binding-fix.yml
          git diff --check
          git config user.name "Eric Tao"
          git config user.email "13306434+sperictao@users.noreply.github.com"
          git add src-tauri/src/publish_runtime.rs src-tauri/src/publish_runtime/source.rs
          git rm --cached --ignore-unmatch .github/scripts/fix_project_binding_ownership.py .github/workflows/tmp-project-binding-fix.yml || true
          git commit -m "fix(runtime): enforce project binding provider ownership"
          git push origin HEAD:tmp/fix-project-binding-ownership

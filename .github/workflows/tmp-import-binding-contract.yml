name: Temporary Import Binding Contract Validation

on:
  push:
    branches:
      - tmp/fix-import-binding-validation

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/scripts/tmp-import-binding-contract.py
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Focused tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml validate_rejects_project_binding_not_owned_by_provider
          cargo test --manifest-path src-tauri/Cargo.toml validate_preserves_incompatible_provider_revision_without_current_schema_validation
          cargo test --manifest-path src-tauri/Cargo.toml imported_profile_with_foreign_project_binding_is_marked_blocked
      - name: Commit clean target tree
        run: |
          git config user.name "Eric Tao"
          git config user.email "13306434+sperictao@users.noreply.github.com"
          git rm .github/workflows/tmp-import-binding-contract.yml .github/scripts/tmp-import-binding-contract.py
          git add src-tauri/src/config_export.rs
          git diff --check --cached
          git commit -m "fix(config): enforce project binding ownership on import"
          git push

name: Quality

on:
  push:
    branches:
      - ci-clippy-import-fix-20260910

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci-clippy-import-fix-20260910
          fetch-depth: 0
      - name: Restore required migration import
        run: |
          python3 -c 'from pathlib import Path; p=Path("src-tauri/src/store/migration.rs"); s=p.read_text(); old="use crate::publish_runtime::PublishConfigurationContent;"; new="use crate::publish_runtime::{PublishBaseRevisionRef, PublishConfigurationContent};"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
      - name: Validate and commit
        run: |
          git checkout cc95d7274c31be9961d3a10dc739fc0e8986f622 -- .github/workflows/quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/quality.yml src-tauri/src/store/migration.rs
          git diff --cached --check
          git commit -m "fix(ci): restore migration revision import"
          git push origin HEAD:ci-clippy-import-fix-20260910

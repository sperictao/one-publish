name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "10.10.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 14
      - run: pnpm check:i18n
      - run: pnpm check:design
      - name: Audit frontend dependencies
        run: pnpm audit --prod

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "10.10.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Cache apt package archives
        uses: actions/cache@v6
        with:
          # .deb 归档缓存：命中时 install 走本地文件、零下载（镜像偶发
          # 挂死反复打挂本 job）。包版本漂移时旧 .deb 被 apt 忽略、只补
          # 下载差异部分——hashFiles 变化时整体换键。
          path: ~/apt-pkg-cache
          key: apt-pkgs-${{ hashFiles('.github/workflows/quality.yml') }}
          restore-keys: apt-pkgs-
      - name: Install Linux dependencies
        timeout-minutes: 20
        run: |
          # apt mirror 偶发挂死或持续慢速：Acquire 超时 + timeout 包裹 + 重试。
          # install 需拉取 ~200MB 依赖；Dir::Cache 重定向到上面的缓存目录，
          # 命中时跳过下载。慢镜像下单次尝试可能接近 8 分钟。
          APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2"
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get $APT_OPTS update; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "apt-get update timed out after 3 attempts"
              exit 1
            fi
            echo "apt-get update timed out (attempt $attempt); retrying"
            sleep 10
          done
          # Dir::Cache 自定义目录要求 archives/partial 预存在（apt 不自建）。
          mkdir -p /home/runner/apt-pkg-cache/archives/partial
          for attempt in 1 2 3; do
            if timeout 480 sudo apt-get $APT_OPTS \
              -o Dir::Cache=/home/runner/apt-pkg-cache \
              install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "apt-get install timed out after 3 attempts"
              exit 1
            fi
            echo "apt-get install timed out (attempt $attempt); retrying"
            sudo dpkg --configure -a || true
            sleep 10
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - name: Format check
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Workspace clippy (crates/*)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests (crates/*)
        run: cargo test --workspace
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Workspace coverage report
        run: cargo llvm-cov --workspace --html --output-dir coverage-rust
      # src-tauri 是独立 workspace（根 Cargo.toml exclude）：平台 crate 报告
      # 之外单独产出桌面壳层报告，同为 informational。
      - name: Desktop coverage report (src-tauri)
        run: cargo llvm-cov --html --output-dir ../coverage-tauri
        working-directory: src-tauri
      - name: Upload Rust coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-coverage
          path: |
            coverage-rust/
            coverage-tauri/
          retention-days: 14
      - name: Contracts drift check
        run: pnpm check:contracts
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit
        working-directory: src-tauri

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "10.10.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright chromium + ffmpeg
        run: pnpm exec playwright install --with-deps chromium ffmpeg
      - name: E2E suite
        run: pnpm e2e

name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: "10.10.0"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 14
      - run: pnpm check:i18n
      - run: pnpm check:design
      - name: Audit frontend dependencies
        run: pnpm audit --prod

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: "10.10.0"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Linux dependencies
        timeout-minutes: 20
        run: |
          # apt mirror 偶发挂死或持续慢速：Acquire 超时 + timeout 包裹 + 重试。
          # install 需拉取 ~200MB 依赖，慢镜像下单次尝试可能接近 8 分钟。
          APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2"
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get $APT_OPTS update; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "apt-get update timed out after 3 attempts"
              exit 1
            fi
            echo "apt-get update timed out (attempt $attempt); retrying"
            sleep 10
          done
          for attempt in 1 2 3; do
            if timeout 480 sudo apt-get $APT_OPTS install -y \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "apt-get install timed out after 3 attempts"
              exit 1
            fi
            echo "apt-get install timed out (attempt $attempt); retrying"
            sudo dpkg --configure -a || true
            sleep 10
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Workspace clippy (crates/*)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests (crates/*)
        run: cargo test --workspace
      - name: Contracts drift check
        run: pnpm check:contracts
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit
        working-directory: src-tauri

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: "10.10.0"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright chromium + ffmpeg
        run: pnpm exec playwright install --with-deps chromium ffmpeg
      - name: E2E suite
        run: pnpm e2e

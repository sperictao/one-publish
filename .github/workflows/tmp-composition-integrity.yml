name: Temporary Composition Integrity Fix

on:
  push:
    branches: [tmp/fix-composition-integrity]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply focused patch
        run: python .github/scripts/tmp-fix-composition-integrity.py
      - name: Diff check
        run: git diff --check
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Focused tests
        run: cargo test --manifest-path src-tauri/Cargo.toml config_export::tests
      - name: Commit clean target tree
        run: |
          git rm .github/scripts/tmp-fix-composition-integrity.py .github/workflows/tmp-composition-integrity.yml
          git diff --check
          git config user.name "Eric Tao"
          git config user.email "13306434+sperictao@users.noreply.github.com"
          git add src-tauri/src/config_export.rs src-tauri/src/publish_runtime.rs src-tauri/src/publish_runtime/source.rs src-tauri/src/store/types.rs
          git commit -m "fix(config): validate composition integrity on import"
          git push origin HEAD:tmp/fix-composition-integrity

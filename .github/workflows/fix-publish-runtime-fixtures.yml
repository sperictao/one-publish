name: Fix runtime fixture newlines

on:
  push:
    branches:
      - fix/runtime-fixture-newlines

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore escaped newlines in test fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/publish_runtime.rs")
          text = path.read_text()
          bsnl = "\\" + "\n"
          replacements = [
              (
                  "module example.invalid/app" + bsnl,
                  "module example.invalid/app\\\\n",
              ),
              (
                  "[package]" + bsnl + 'name = \\"demo\\"' + bsnl + 'version = \\"{version}\\"' + bsnl,
                  '[package]\\\\nname = \\"demo\\"\\\\nversion = \\"{version}\\"\\\\n',
              ),
              (
                  "# fixture" + bsnl,
                  "# fixture\\\\n",
              ),
              (
                  "[package]" + bsnl + 'name = \\"kiosk\\"' + bsnl + 'version = \\"2.0.0\\"' + bsnl,
                  '[package]\\\\nname = \\"kiosk\\"\\\\nversion = \\"2.0.0\\"\\\\n',
              ),
              (
                  ".env.local" + bsnl,
                  ".env.local\\\\n",
              ),
              (
                  "registry=https://example.invalid" + bsnl,
                  "registry=https://example.invalid\\\\n",
              ),
              (
                  "module example.invalid/one-publish" + bsnl,
                  "module example.invalid/one-publish\\\\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one fixture match for {old!r}, found {count}")
              text = text.replace(old, new)

          path.write_text(text)
          PY
      - name: Commit focused cleanup
        shell: bash
        run: |
          rm .github/workflows/fix-publish-runtime-fixtures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/publish_runtime.rs .github/workflows/fix-publish-runtime-fixtures.yml
          git diff --cached --check
          git commit -m "test(runtime): restore fixture newlines"
          git push origin HEAD:fix/runtime-fixture-newlines

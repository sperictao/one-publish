version: 2
updates:
  # GitHub Actions — keep workflow pins on current majors.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Frontend dependencies (pnpm). Minor/patch grouped into one PR;
  # majors arrive individually for deliberate review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # typescript 7 (tsgo) has no JS compiler API; the
    # tauriCommandContract test consumes ts.TypeChecker semantics that
    # only exist in the TypeScript <=6 implementation. Revisit once a
    # native-preview JS API or a rewritten test path exists.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node majors track the runtime major; CI pins Node 24, so
      # newer type majors would declare APIs the runtime lacks. Revisit
      # when CI moves to Node 26.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Rust workspace crates (publish-domain/-adapters/-planner/
  # -runner-core, one-publish-runner).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # Desktop shell — separate crate graph outside the workspace.
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
